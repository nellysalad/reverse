<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap">
  <style>
    body { font-family: "Kosugi Maru", sans-serif; color: magenta; }
    #source,
    #reverse {
      white-space: pre-wrap;
      color: magenta;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }
    #source {
      outline: none;
      display: block;
      margin-top: 4rem;
      padding-top: 1rem;
      margin-right: 4rem;
      margin-left: 4rem;
      caret-color: #66FF00;
      caret-width: 12px;
    }
    #source.empty::before {
      content: attr(data-placeholder);
      color: #f5a8c4;
    }
    #reverse {
      outline: none;
      display: block;
      margin-top: 1rem;
      padding-top: 1rem;
      margin-right: 4rem;
      margin-left: 4rem;
      caret-color: #66FF00;
      caret-width: 12px;
    }
    #reverse:empty {
      margin: 0;
      padding: 0;
      border: none;
    }
    ::selection {
      background: #66ff00;
      color: magenta;
    }
    #mirror-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    #mirror-overlay i {
      position: absolute;
      display: block;
      background: #66ff00;
    }
  </style>
</head>
<body>
<span id="source" contenteditable="true" class="empty" data-placeholder="→ y◎u should type here if y⁕u want..."></span><span id="reverse" contenteditable="true"></span>
<div id="mirror-overlay" aria-hidden="true"></div>
<script>
  const source = document.getElementById("source");
  const reverse = document.getElementById("reverse");

  function flipWord(word) {
    const match = word.match(/^(.*?)([.,]+)$/);
    if (!match || !match[1]) return word;
    return match[2] + match[1];
  }

  function unflipWord(word) {
    const match = word.match(/^([.,]+)(.+)$/);
    if (!match) return word;
    return match[2] + match[1];
  }

  function reverseLine(line) {
    const words = line.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "";
    return words.map(flipWord).reverse().join(" ");
  }

  function unreverseLine(line) {
    const words = line.trim().split(/\s+/).filter(Boolean);
    if (!words.length) return "";
    return words.map(unflipWord).reverse().join(" ");
  }

  function mapText(text, lineFn) {
    if (!text) return "";
    return text
      .split(/\n{2,}/)
      .map((paragraph) => paragraph.split("\n").map(lineFn).join("\n"))
      .join("\n\n");
  }

  let syncing = false;
  const overlay = document.getElementById("mirror-overlay");

  function isBlockLike(node) {
    return (
      node &&
      node.nodeType === Node.ELEMENT_NODE &&
      /^(DIV|P|LI|H[1-6]|TR|BLOCKQUOTE|PRE|SECTION|ARTICLE|HEADER|FOOTER|UL|OL|TABLE|THEAD|TBODY|TFOOT)$/.test(
        node.tagName
      )
    );
  }

  function scanPlainText(root, onText, onBreak) {
    function walk(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        onText(node);
        return;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (node.tagName === "BR") {
        onBreak();
        return;
      }
      for (let i = 0; i < node.childNodes.length; i++) {
        const child = node.childNodes[i];
        const prev = i > 0 ? node.childNodes[i - 1] : null;
        if (prev && (isBlockLike(prev) || isBlockLike(child))) onBreak();
        walk(child);
      }
    }
    walk(root);
  }

  function plainTextInfo(root) {
    let text = "";
    const pieces = [];
    scanPlainText(
      root,
      (node) => {
        pieces.push({
          node,
          start: text.length,
          end: text.length + node.data.length,
        });
        text += node.data;
      },
      () => {
        text += "\n";
      }
    );
    return { text, pieces };
  }

  function lineSegments(text) {
    const segments = [];
    if (!text) return segments;
    let offset = 0;
    const paragraphs = text.split(/\n{2,}/);
    for (let p = 0; p < paragraphs.length; p++) {
      if (p > 0) offset += 2;
      const lines = paragraphs[p].split("\n");
      for (let l = 0; l < lines.length; l++) {
        if (l > 0) offset += 1;
        const line = lines[l];
        segments.push({ start: offset, end: offset + line.length, line, p, l });
        offset += line.length;
      }
    }
    return segments;
  }

  function wordBounds(line) {
    const words = [];
    const re = /\S+/g;
    let match;
    while ((match = re.exec(line))) {
      words.push({
        i: words.length,
        start: match.index,
        end: match.index + match[0].length,
      });
    }
    return words;
  }

  function wordRangeForCharRange(line, charStart, charEnd) {
    if (charStart >= charEnd) return null;
    const words = wordBounds(line);
    if (!words.length) return null;
    let first = words.length;
    let last = -1;
    for (const word of words) {
      if (word.end > charStart && word.start < charEnd) {
        first = Math.min(first, word.i);
        last = Math.max(last, word.i);
      }
    }
    if (last < 0) return null;
    return { first, last, count: words.length };
  }

  function offsetAt(root, targetNode, targetOffset) {
    if (!root.contains(targetNode) && root !== targetNode) return 0;
    let pos = 0;
    let found = false;

    function walk(node) {
      if (found) return;
      if (node.nodeType === Node.TEXT_NODE) {
        if (node === targetNode) {
          pos += Math.min(targetOffset, node.data.length);
          found = true;
        } else {
          pos += node.data.length;
        }
        return;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) return;
      if (node.tagName === "BR") {
        if (node === targetNode) {
          found = true;
          return;
        }
        pos += 1;
        return;
      }
      for (let i = 0; i < node.childNodes.length; i++) {
        if (node === targetNode && i === targetOffset) {
          found = true;
          return;
        }
        const child = node.childNodes[i];
        const prev = i > 0 ? node.childNodes[i - 1] : null;
        if (prev && (isBlockLike(prev) || isBlockLike(child))) pos += 1;
        walk(child);
        if (found) return;
      }
      if (node === targetNode) found = true;
    }

    walk(root);
    return pos;
  }

  function getSelectionOffsets(container) {
    const selection = window.getSelection();
    if (!selection.rangeCount) return null;
    const range = selection.getRangeAt(0);
    if (!container.contains(range.commonAncestorContainer)) return null;
    const start = offsetAt(container, range.startContainer, range.startOffset);
    const end = offsetAt(container, range.endContainer, range.endOffset);
    return { start, end };
  }

  function pointFromOffset(pieces, pos, isEnd) {
    for (const piece of pieces) {
      if (!isEnd && pos >= piece.start && pos < piece.end) {
        return [piece.node, pos - piece.start];
      }
      if (isEnd && pos > piece.start && pos <= piece.end) {
        return [piece.node, pos - piece.start];
      }
    }
    if (!isEnd) {
      for (const piece of pieces) {
        if (piece.start >= pos) return [piece.node, 0];
      }
    } else {
      for (let i = pieces.length - 1; i >= 0; i--) {
        if (pieces[i].end <= pos) {
          return [pieces[i].node, pieces[i].node.data.length];
        }
      }
    }
    return null;
  }

  function rangeFromOffsets(root, start, end) {
    if (start >= end) return null;
    const { pieces } = plainTextInfo(root);
    const startPoint = pointFromOffset(pieces, start, false);
    const endPoint = pointFromOffset(pieces, end, true);
    if (!startPoint || !endPoint) return null;
    const range = document.createRange();
    range.setStart(startPoint[0], startPoint[1]);
    range.setEnd(endPoint[0], endPoint[1]);
    return range;
  }

  function clearMirrorHighlight() {
    overlay.replaceChildren();
  }

  function paintRanges(ranges, host) {
    clearMirrorHighlight();
    const lineHeight = parseFloat(getComputedStyle(host).lineHeight);
    for (const range of ranges) {
      for (const rect of range.getClientRects()) {
        if (!rect.width || !rect.height) continue;
        const height = lineHeight > rect.height ? lineHeight : rect.height;
        const top = rect.top - (height - rect.height) / 2;
        const mark = document.createElement("i");
        mark.style.left = `${rect.left}px`;
        mark.style.top = `${top}px`;
        mark.style.width = `${rect.width}px`;
        mark.style.height = `${height}px`;
        overlay.appendChild(mark);
      }
    }
  }

  function updateMirrorHighlight() {
    if (syncing) {
      clearMirrorHighlight();
      return;
    }

    let active;
    let mirror;
    const selection = window.getSelection();
    if (!selection.rangeCount) {
      clearMirrorHighlight();
      return;
    }

    const anchor = selection.anchorNode;
    if (source.contains(anchor)) {
      active = source;
      mirror = reverse;
    } else if (reverse.contains(anchor)) {
      active = reverse;
      mirror = source;
    } else {
      clearMirrorHighlight();
      return;
    }

    const offsets = getSelectionOffsets(active);
    if (!offsets || offsets.start === offsets.end) {
      clearMirrorHighlight();
      return;
    }

    const activeText = plainTextInfo(active).text;
    const mirrorText = plainTextInfo(mirror).text;
    const activeSegments = lineSegments(activeText);
    const mirrorSegments = lineSegments(mirrorText);
    const ranges = [];

    for (const segment of activeSegments) {
      if (segment.end <= offsets.start || segment.start >= offsets.end) continue;
      const relStart = Math.max(offsets.start, segment.start) - segment.start;
      const relEnd = Math.min(offsets.end, segment.end) - segment.start;
      const wordRange = wordRangeForCharRange(segment.line, relStart, relEnd);
      if (!wordRange) continue;

      const mirrorSegment = mirrorSegments.find(
        (part) => part.p === segment.p && part.l === segment.l
      );
      if (!mirrorSegment) continue;

      const mirrorWords = wordBounds(mirrorSegment.line);
      const mirrorFirst = wordRange.count - 1 - wordRange.last;
      const mirrorLast = wordRange.count - 1 - wordRange.first;
      const mirrorStart = mirrorWords[mirrorFirst]?.start;
      const mirrorEnd = mirrorWords[mirrorLast]?.end;
      if (mirrorStart === undefined) continue;

      const range = rangeFromOffsets(
        mirror,
        mirrorSegment.start + mirrorStart,
        mirrorSegment.start + mirrorEnd
      );
      if (range) ranges.push(range);
    }

    if (ranges.length) paintRanges(ranges, mirror);
    else clearMirrorHighlight();
  }

  function renderFromSource() {
    if (syncing) return;
    syncing = true;
    const text = source.innerText;
    source.classList.toggle("empty", !text.trim());
    reverse.innerText = mapText(text, reverseLine);
    syncing = false;
  }

  function renderFromReverse() {
    if (syncing) return;
    syncing = true;
    const text = reverse.innerText;
    source.innerText = mapText(text, unreverseLine);
    source.classList.toggle("empty", !source.innerText.trim());
    syncing = false;
  }

  function pastePlainText(e) {
    e.preventDefault();
    const text = e.clipboardData.getData("text/plain");
    const target = e.currentTarget;
    target.focus();
    document.execCommand("insertText", false, text);
  }

  source.addEventListener("paste", pastePlainText);
  reverse.addEventListener("paste", pastePlainText);
  source.addEventListener("input", renderFromSource);
  reverse.addEventListener("input", renderFromReverse);
  document.addEventListener("selectionchange", updateMirrorHighlight);
  window.addEventListener("scroll", updateMirrorHighlight, true);
  window.addEventListener("resize", updateMirrorHighlight);

  source.focus();
  renderFromSource();
</script>
</body>
</html>
